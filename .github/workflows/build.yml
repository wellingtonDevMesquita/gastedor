name: Gerar Executável Windows

on:
  push:
    branches: [ main ]  # Executa toda vez que você der "push" na branch main

jobs:
  build:
    runs-on: windows-latest  # Aqui acontece a mágica: o GitHub abre um Windows

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Instalar bibliotecas
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter matplotlib  # Adicione aqui todas as suas bibliotecas

    - name: Gerar .exe com PyInstaller
      run: |
        pip install pyinstaller
        pyinstaller --noconsole --onefile main.py

    - name: Guardar o executável
      uses: actions/upload-artifact@v3
      with:
        name: SistemaFinanceiro-Windows
        path: dist/main.exe